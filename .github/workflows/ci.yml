name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler.name }} ${{ matrix.build_type }} ${{ matrix.linkage.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
        build_type:
          - Debug
          - Release
        linkage:
          - name: static
            shared: "OFF"
          - name: shared
            shared: "ON"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.linkage.shared }}
          -DEXTORA_BUILD_ASIO_ADAPTER=ON
          -DEXTORA_BUILD_EXAMPLES=ON
          -DEXTORA_BUILD_HTTP_SERVER_EXAMPLE=ON
          -DEXTORA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  address-undefined-sanitizer:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=ON
          -DEXTORA_BUILD_ASIO_ADAPTER=ON
          -DEXTORA_BUILD_EXAMPLES=ON
          -DEXTORA_BUILD_HTTP_SERVER_EXAMPLE=ON
          -DEXTORA_BUILD_TESTS=ON
          -DEXTORA_ENABLE_SANITIZERS=ON

      - name: Build
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: cmake --build build --parallel 4

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF
          -DEXTORA_BUILD_EXAMPLES=OFF
          -DEXTORA_BUILD_TESTS=ON
          -DEXTORA_ENABLE_THREAD_SANITIZER=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install gcovr
        run: pipx install gcovr==8.6

      - name: Configure
        run: cmake --preset gcc-debug-static-coverage

      - name: Test and generate report
        run: cmake --build --preset gcc-debug-static-coverage --parallel 4

      - name: Add summary
        run: cat build/gcc-debug-static-coverage/report/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Pages report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: python
        run: |
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ElementTree

          report_directory = Path("build/gcc-debug-static-coverage/report")
          report = ElementTree.parse(report_directory / "coverage.xml")
          percentage = float(report.getroot().attrib["line-rate"]) * 100

          if percentage >= 90:
              color = "brightgreen"
          elif percentage >= 80:
              color = "green"
          elif percentage >= 70:
              color = "yellowgreen"
          elif percentage >= 60:
              color = "yellow"
          else:
              color = "red"

          badge = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{percentage:.1f}%",
              "color": color,
          }
          (report_directory / "coverage.json").write_text(
              json.dumps(badge, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

      - name: Upload report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: build/gcc-debug-static-coverage/report
          if-no-files-found: error

      - name: Upload Pages report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/gcc-debug-static-coverage/report

  coverage-pages:
    name: Publish coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy coverage report
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  system-dependencies:
    name: System dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/dependency-prefix

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev libsqlite3-dev ninja-build

      - name: Fetch pinned dependency sources
        run: >-
          cmake -S . -B dependency-source -G Ninja
          -DEXTORA_BUILD_ASIO_ADAPTER=ON
          -DEXTORA_BUILD_EXAMPLES=OFF
          -DEXTORA_BUILD_TESTS=OFF
          -DEXTORA_ENABLE_INSTALL=OFF
          -DEXTORA_USE_BUNDLED_SQLITE=OFF

      - name: Install xxHash as a system package
        run: |
          cmake \
            -S dependency-source/_deps/extora_xxhash_source-src/cmake_unofficial \
            -B xxhash-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/dependency-prefix" \
            -DBUILD_SHARED_LIBS=OFF \
            -DXXHASH_BUILD_XXHSUM=OFF
          cmake --build xxhash-build --target install --parallel 4

      - name: Install Boost as a system package
        run: |
          cmake \
            -S dependency-source/_deps/extora_boost_source-src \
            -B dependency-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/dependency-prefix" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBOOST_INCLUDE_LIBRARIES="asio;beast;context;coroutine;json;system"
          cmake --build dependency-build --target install --parallel 4

      - name: Configure without bundled dependencies
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEXTORA_BUILD_ASIO_ADAPTER=ON
          -DEXTORA_BUILD_EXAMPLES=ON
          -DEXTORA_BUILD_HTTP_SERVER_EXAMPLE=ON
          -DEXTORA_BUILD_TESTS=ON
          -DEXTORA_USE_BUNDLED_BOOST=OFF
          -DEXTORA_USE_BUNDLED_GTEST=OFF
          -DEXTORA_USE_BUNDLED_SQLITE=OFF
          -DEXTORA_USE_BUNDLED_XXHASH=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  debian-10:
    name: Debian 10 GCC Release static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: debian:10-slim
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install toolchain
        run: |
          sed -i 's|deb.debian.org/debian|archive.debian.org/debian|g' /etc/apt/sources.list
          sed -i '/buster-updates/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            ninja-build \
            python3-pip
          python3 -m pip install --no-cache-dir --upgrade pip==24.0
          python3 -m pip install --no-cache-dir cmake==3.28.4

      - uses: actions/checkout@v7.0.1

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DEXTORA_BUILD_ASIO_ADAPTER=ON
          -DEXTORA_BUILD_EXAMPLES=ON
          -DEXTORA_BUILD_HTTP_SERVER_EXAMPLE=ON
          -DEXTORA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  package:
    name: Debian 10 packages ${{ matrix.linkage }} with system SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: debian:10-slim
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        include:
          - shared: "OFF"
            linkage: static
          - shared: "ON"
            linkage: shared

    steps:
      - name: Install dependencies
        run: |
          sed -i 's|deb.debian.org/debian|archive.debian.org/debian|g' /etc/apt/sources.list
          sed -i '/buster-updates/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            cpio \
            dpkg-dev \
            file \
            git \
            libsqlite3-dev \
            ninja-build \
            python3-pip \
            rpm \
            unzip
          python3 -m pip install --no-cache-dir --upgrade pip==24.0
          python3 -m pip install --no-cache-dir cmake==3.28.4

      - uses: actions/checkout@v7.0.1

      - name: Configure
        run: >-
          cmake -S . -B build/packages -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DEXTORA_BUILD_TESTS=ON
          -DEXTORA_USE_BUNDLED_SQLITE=OFF

      - name: Build and test
        run: |
          cmake --build build/packages --parallel 2
          ctest --test-dir build/packages --output-on-failure

      - name: Generate packages
        run: |
          cpack --config build/packages/CPackConfig.cmake -G DEB
          cpack --config build/packages/CPackConfig.cmake -G RPM
          cpack --config build/packages/CPackConfig.cmake -G TGZ
          cpack --config build/packages/CPackConfig.cmake -G ZIP

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail

          package_dir="${GITHUB_WORKSPACE}/build/packages/packages"
          deb_development="$(find "${package_dir}" -maxdepth 1 -name 'libextora-dev_*.deb' -print -quit)"
          rpm_development="$(find "${package_dir}" -maxdepth 1 -name 'extora-devel-*.rpm' -print -quit)"
          tgz_package="$(find "${package_dir}" -maxdepth 1 -name 'extora-*.tar.gz' -print -quit)"
          zip_package="$(find "${package_dir}" -maxdepth 1 -name 'extora-*.zip' -print -quit)"

          test -n "${deb_development}"
          test -n "${rpm_development}"
          test -n "${tgz_package}"
          test -n "${zip_package}"

          (
            cd "${package_dir}"
            sha256sum -c ./*.sha256
          )

          dpkg-deb --field "${deb_development}" Depends | grep -F 'libsqlite3-dev'
          rpm -qp --requires "${rpm_development}" | grep -Fx 'sqlite-devel'

          deb_root="${GITHUB_WORKSPACE}/build/packages/deb-root"
          rpm_root="${GITHUB_WORKSPACE}/build/packages/rpm-root"
          tgz_root="${GITHUB_WORKSPACE}/build/packages/tgz-root"
          zip_root="${GITHUB_WORKSPACE}/build/packages/zip-root"
          mkdir -p "${deb_root}" "${rpm_root}" "${tgz_root}" "${zip_root}"
          dpkg-deb -x "${deb_development}" "${deb_root}"
          (
            cd "${rpm_root}"
            rpm2cpio "${rpm_development}" | cpio -idmu
          )
          tar -xzf "${tgz_package}" -C "${tgz_root}"
          unzip -q "${zip_package}" -d "${zip_root}"

          if [ "${{ matrix.shared }}" = ON ]; then
            deb_runtime="$(find "${package_dir}" -maxdepth 1 -name 'libextora[0-9]*_*.deb' -print -quit)"
            rpm_runtime="$(find "${package_dir}" -maxdepth 1 -name 'extora-[0-9]*.rpm' -print -quit)"
            test -n "${deb_runtime}"
            test -n "${rpm_runtime}"
            dpkg-deb -x "${deb_runtime}" "${deb_root}"
            (
              cd "${rpm_root}"
              rpm2cpio "${rpm_runtime}" | cpio -idmu
            )
          fi

          for package in deb rpm tgz zip; do
            if [ "${package}" = deb ]; then
              package_root="${deb_root}"
            elif [ "${package}" = rpm ]; then
              package_root="${rpm_root}"
            elif [ "${package}" = tgz ]; then
              package_root="$(find "${tgz_root}" -type d -path '*/usr' -printf '%h\n' -quit)"
            else
              package_root="$(find "${zip_root}" -type d -path '*/usr' -printf '%h\n' -quit)"
            fi
            test -n "${package_root}"

            cmake \
              -S tests/Consumer \
              -B "build/packages/${package}-consumer" \
              -G Ninja \
              -DCMAKE_PREFIX_PATH="${package_root}/usr"
            cmake --build "build/packages/${package}-consumer" --parallel 2

            if [ "${{ matrix.shared }}" = ON ]; then
              library_dir="$(find "${package_root}/usr" -type f -name 'libextora.so.*' -printf '%h\n' -quit)"
              test -n "${library_dir}"
              LD_LIBRARY_PATH="${library_dir}" \
                "build/packages/${package}-consumer/ExtoraConsumer"
            else
              "build/packages/${package}-consumer/ExtoraConsumer"
            fi
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages-${{ matrix.linkage }}
          path: build/packages/packages
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.build_type }} ${{ matrix.linkage.name }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release
        linkage:
          - name: static
            shared: "OFF"
          - name: shared
            shared: "ON"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.linkage.shared }}
          -DEXTORA_BUILD_ASIO_ADAPTER=ON
          -DEXTORA_BUILD_EXAMPLES=ON
          -DEXTORA_BUILD_HTTP_SERVER_EXAMPLE=ON
          -DEXTORA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows ${{ matrix.build_type }} ${{ matrix.linkage.name }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release
        linkage:
          - name: static
            shared: "OFF"
          - name: shared
            shared: "ON"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build -A x64 ^
            -DBUILD_SHARED_LIBS=${{ matrix.linkage.shared }} ^
            -DEXTORA_BUILD_ASIO_ADAPTER=ON ^
            -DEXTORA_BUILD_EXAMPLES=ON ^
            -DEXTORA_BUILD_HTTP_SERVER_EXAMPLE=ON ^
            -DEXTORA_BUILD_TESTS=ON

      - name: Build
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Test
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
